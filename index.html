<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dad!</title>
    <style>
        body {
            background-image: url('image (2).jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars as balloons float up */
        }

        .card {
            background: rgba(255, 255, 255, 0.85); 
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(5px); 
            max-width: 400px;
            z-index: 10; /* Keeps the card in front of the balloons */
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        /* Balloon Container and Styling */
        .balloon-container {
            position: absolute;
            bottom: -100px; /* Starts balloons completely off-screen */
            display: flex;
            gap: 15px;
            z-index: 5;
            /* Animation triggers the floating up effect */
            animation: floatUp 14s linear infinite; 
        }

        .balloon {
            width: 55px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ffe066, #d4af37, #aa8010); /* Metallic gold gradient */
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; /* Creates balloon shape */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.2);
        }

        /* The letter inside the balloon */
        .balloon::after {
            content: attr(data-letter);
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 2rem;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            font-weight: bold;
        }

        /* The balloon knot */
        .balloon::before {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 24px;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid #aa8010;
        }

        /* The balloon string */
        .string {
            position: absolute;
            bottom: -40px;
            left: 27px;
            width: 1px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.5);
        }

        /* Slow Floating Up Animation */
        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1; /* Fade in smoothly near the bottom */
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh); /* Moves all the way past the top of the screen */
                opacity: 0; /* Fade out at the very top */
            }
        }
    </style>
</head>
<body>

    <!-- Gold Foil Balloons -->
    <div class="balloon-container">
        <div class="balloon" data-letter="H"><div class="string"></div></div>
        <div class="balloon" data-letter="A"><div class="string"></div></div>
        <div class="balloon" data-letter="P"><div class="string"></div></div>
        <div class="balloon" data-letter="P"><div class="string"></div></div>
        <div class="balloon" data-letter="Y"><div class="string"></div></div>
        <!-- Space between words -->
        <div style="width: 20px;"></div> 
        <div class="balloon" data-letter="B"><div class="string"></div></div>
        <div class="balloon" data-letter="I"><div class="string"></div></div>
        <div class="balloon" data-letter="R"><div class="string"></div></div>
        <div class="balloon" data-letter="T"><div class="string"></div></div>
        <div class="balloon" data-letter="H"><div class="string"></div></div>
        <div class="balloon" data-letter="D"><div class="string"></div></div>
        <div class="balloon" data-letter="A"><div class="string"></div></div>
        <div class="balloon" data-letter="Y"><div class="string"></div></div>
    </div>

    <!-- Center Message Card -->
    <div class="card">
        <h1>Happy Birthday, Dad! 🏔️</h1>
        <p>Wishing the best dad in the world an incredible day filled with new peaks to conquer!</p>
    </div>

</body>
</html>
